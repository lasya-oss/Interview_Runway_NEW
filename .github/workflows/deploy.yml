name: Deploy Workers

on:
  push:
    branches:
      - staging
  workflow_dispatch:
    inputs:
      confirm_production:
        description: Type DEPLOY_PRODUCTION to confirm the manual production cutover
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  staging:
    name: Deploy staging
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: staging
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Validate staging deployment secrets
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AUTH_SESSION_SECRET: ${{ secrets.STAGING_AUTH_SESSION_SECRET }}
          CEREBRAS_API_KEY: ${{ secrets.STAGING_CEREBRAS_API_KEY }}
          DEMO_SESSION_SECRET: ${{ secrets.STAGING_DEMO_SESSION_SECRET }}
          GROQ_API_KEY: ${{ secrets.STAGING_GROQ_API_KEY }}
          MEETING_COPILOT_BRIDGE_SECRET: ${{ secrets.STAGING_MEETING_COPILOT_BRIDGE_SECRET }}
          PADDLE_API_KEY: ${{ secrets.STAGING_PADDLE_API_KEY }}
          PADDLE_CLIENT_TOKEN: ${{ secrets.STAGING_PADDLE_CLIENT_TOKEN }}
          PADDLE_WEBHOOK_SECRET: ${{ secrets.STAGING_PADDLE_WEBHOOK_SECRET }}
          TEST_FOUNDATION_EMAILS: ${{ secrets.STAGING_TEST_FOUNDATION_EMAILS }}
          TEST_FULL_ACCESS_EMAILS: ${{ secrets.STAGING_TEST_FULL_ACCESS_EMAILS }}
          TEST_SECOND_SEAT_EMAILS: ${{ secrets.STAGING_TEST_SECOND_SEAT_EMAILS }}
        run: |
          required=(
            CLOUDFLARE_API_TOKEN
            CLOUDFLARE_ACCOUNT_ID
            AUTH_SESSION_SECRET
            CEREBRAS_API_KEY
            DEMO_SESSION_SECRET
            GROQ_API_KEY
            MEETING_COPILOT_BRIDGE_SECRET
            PADDLE_API_KEY
            PADDLE_CLIENT_TOKEN
            PADDLE_WEBHOOK_SECRET
            TEST_FOUNDATION_EMAILS
            TEST_FULL_ACCESS_EMAILS
            TEST_SECOND_SEAT_EMAILS
          )
          for name in "${required[@]}"; do
            if [[ -z "${!name}" ]]; then
              echo "::error::$name is not configured"
              exit 1
            fi
          done

      - name: Apply staging D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply DB --remote --config wrangler.staging.jsonc

      - name: Configure staging Worker secrets
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AUTH_SESSION_SECRET: ${{ secrets.STAGING_AUTH_SESSION_SECRET }}
          CEREBRAS_API_KEY: ${{ secrets.STAGING_CEREBRAS_API_KEY }}
          DEMO_SESSION_SECRET: ${{ secrets.STAGING_DEMO_SESSION_SECRET }}
          GROQ_API_KEY: ${{ secrets.STAGING_GROQ_API_KEY }}
          MEETING_COPILOT_BRIDGE_SECRET: ${{ secrets.STAGING_MEETING_COPILOT_BRIDGE_SECRET }}
          PADDLE_API_KEY: ${{ secrets.STAGING_PADDLE_API_KEY }}
          PADDLE_CLIENT_TOKEN: ${{ secrets.STAGING_PADDLE_CLIENT_TOKEN }}
          PADDLE_WEBHOOK_SECRET: ${{ secrets.STAGING_PADDLE_WEBHOOK_SECRET }}
          TEST_FOUNDATION_EMAILS: ${{ secrets.STAGING_TEST_FOUNDATION_EMAILS }}
          TEST_FULL_ACCESS_EMAILS: ${{ secrets.STAGING_TEST_FULL_ACCESS_EMAILS }}
          TEST_SECOND_SEAT_EMAILS: ${{ secrets.STAGING_TEST_SECOND_SEAT_EMAILS }}
        run: |
          node <<'NODE' | npx wrangler secret bulk --config wrangler.staging.jsonc >/dev/null
          const names = [
            "AUTH_SESSION_SECRET",
            "CEREBRAS_API_KEY",
            "DEMO_SESSION_SECRET",
            "GROQ_API_KEY",
            "MEETING_COPILOT_BRIDGE_SECRET",
            "PADDLE_API_KEY",
            "PADDLE_CLIENT_TOKEN",
            "PADDLE_WEBHOOK_SECRET",
            "TEST_FOUNDATION_EMAILS",
            "TEST_FULL_ACCESS_EMAILS",
            "TEST_SECOND_SEAT_EMAILS",
          ];
          process.stdout.write(JSON.stringify(Object.fromEntries(names.map((name) => [name, process.env[name]]))));
          NODE
          echo "Configured staging Worker secret names"

      - name: Deploy staging Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.staging.jsonc

  production:
    name: Deploy production (manual only)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - name: Check production confirmation
        shell: bash
        run: |
          if [[ "${{ inputs.confirm_production }}" != "DEPLOY_PRODUCTION" ]]; then
            echo "::error::Production deployment was not explicitly confirmed"
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Validate production deployment secrets
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AUTH_SESSION_SECRET: ${{ secrets.PRODUCTION_AUTH_SESSION_SECRET }}
          CEREBRAS_API_KEY: ${{ secrets.PRODUCTION_CEREBRAS_API_KEY }}
          DEMO_SESSION_SECRET: ${{ secrets.PRODUCTION_DEMO_SESSION_SECRET }}
          GROQ_API_KEY: ${{ secrets.PRODUCTION_GROQ_API_KEY }}
          MEETING_COPILOT_BRIDGE_SECRET: ${{ secrets.PRODUCTION_MEETING_COPILOT_BRIDGE_SECRET }}
          PADDLE_API_KEY: ${{ secrets.PRODUCTION_PADDLE_API_KEY }}
          PADDLE_CLIENT_TOKEN: ${{ secrets.PRODUCTION_PADDLE_CLIENT_TOKEN }}
          PADDLE_WEBHOOK_SECRET: ${{ secrets.PRODUCTION_PADDLE_WEBHOOK_SECRET }}
          TEST_FOUNDATION_EMAILS: ${{ secrets.PRODUCTION_TEST_FOUNDATION_EMAILS }}
          TEST_FULL_ACCESS_EMAILS: ${{ secrets.PRODUCTION_TEST_FULL_ACCESS_EMAILS }}
          TEST_SECOND_SEAT_EMAILS: ${{ secrets.PRODUCTION_TEST_SECOND_SEAT_EMAILS }}
        run: |
          required=(
            CLOUDFLARE_API_TOKEN
            CLOUDFLARE_ACCOUNT_ID
            AUTH_SESSION_SECRET
            CEREBRAS_API_KEY
            DEMO_SESSION_SECRET
            GROQ_API_KEY
            MEETING_COPILOT_BRIDGE_SECRET
            PADDLE_API_KEY
            PADDLE_CLIENT_TOKEN
            PADDLE_WEBHOOK_SECRET
            TEST_FOUNDATION_EMAILS
            TEST_FULL_ACCESS_EMAILS
            TEST_SECOND_SEAT_EMAILS
          )
          for name in "${required[@]}"; do
            if [[ -z "${!name}" ]]; then
              echo "::error::$name is not configured"
              exit 1
            fi
          done

      - name: Apply production D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply DB --remote --config wrangler.jsonc

      - name: Configure production Worker secrets
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AUTH_SESSION_SECRET: ${{ secrets.PRODUCTION_AUTH_SESSION_SECRET }}
          CEREBRAS_API_KEY: ${{ secrets.PRODUCTION_CEREBRAS_API_KEY }}
          DEMO_SESSION_SECRET: ${{ secrets.PRODUCTION_DEMO_SESSION_SECRET }}
          GROQ_API_KEY: ${{ secrets.PRODUCTION_GROQ_API_KEY }}
          MEETING_COPILOT_BRIDGE_SECRET: ${{ secrets.PRODUCTION_MEETING_COPILOT_BRIDGE_SECRET }}
          PADDLE_API_KEY: ${{ secrets.PRODUCTION_PADDLE_API_KEY }}
          PADDLE_CLIENT_TOKEN: ${{ secrets.PRODUCTION_PADDLE_CLIENT_TOKEN }}
          PADDLE_WEBHOOK_SECRET: ${{ secrets.PRODUCTION_PADDLE_WEBHOOK_SECRET }}
          TEST_FOUNDATION_EMAILS: ${{ secrets.PRODUCTION_TEST_FOUNDATION_EMAILS }}
          TEST_FULL_ACCESS_EMAILS: ${{ secrets.PRODUCTION_TEST_FULL_ACCESS_EMAILS }}
          TEST_SECOND_SEAT_EMAILS: ${{ secrets.PRODUCTION_TEST_SECOND_SEAT_EMAILS }}
        run: |
          node <<'NODE' | npx wrangler secret bulk --config wrangler.jsonc >/dev/null
          const names = [
            "AUTH_SESSION_SECRET",
            "CEREBRAS_API_KEY",
            "DEMO_SESSION_SECRET",
            "GROQ_API_KEY",
            "MEETING_COPILOT_BRIDGE_SECRET",
            "PADDLE_API_KEY",
            "PADDLE_CLIENT_TOKEN",
            "PADDLE_WEBHOOK_SECRET",
            "TEST_FOUNDATION_EMAILS",
            "TEST_FULL_ACCESS_EMAILS",
            "TEST_SECOND_SEAT_EMAILS",
          ];
          process.stdout.write(JSON.stringify(Object.fromEntries(names.map((name) => [name, process.env[name]]))));
          NODE
          echo "Configured production Worker secret names"

      - name: Deploy production Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.jsonc
